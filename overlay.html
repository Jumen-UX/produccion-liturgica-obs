<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Producción litúrgica · Salida OBS</title><style>
:root{--gold:#D6B678;--navy:#0A1C29;--white:#F4F7F9;--primary:#2E986E;--panel:#102C35}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif;color:var(--white)}.canvas{position:relative;width:100vw;height:100vh;overflow:hidden}.bg{position:absolute;inset:0;background:radial-gradient(ellipse at 80% 15%,var(--panel) 0%,var(--navy) 75%)}.gridlight{position:absolute;inset:-20%;opacity:.4;background:radial-gradient(circle at 25% 30%,color-mix(in srgb,var(--gold) 13%,transparent),transparent 30%),radial-gradient(circle at 85% 80%,color-mix(in srgb,var(--primary) 15%,transparent),transparent 22%);animation:float 15s ease-in-out infinite alternate}.particle{position:absolute;width:3px;height:3px;background:var(--gold);border-radius:50%;opacity:.45;animation:drift var(--dur) linear infinite;left:var(--left);top:110%}@keyframes drift{to{transform:translate(var(--move),-140vh);opacity:0}}@keyframes float{to{transform:translate(3%,4%)}}.gold{color:var(--gold)}.brand{position:absolute;top:6%;left:5.8%;right:5.8%;display:flex;align-items:center;gap:24px}.brand img{width:118px;height:118px;object-fit:contain}.brand strong{font-size:clamp(24px,2vw,40px);letter-spacing:.02em;line-height:1.12}.brand span{display:block;text-transform:uppercase;letter-spacing:.17em;font-size:clamp(11px,1vw,18px);color:var(--gold);margin-bottom:8px}.brand .mark{width:8px;height:80px;background:var(--gold);border-radius:7px}.wait-title{position:absolute;top:29%;left:6%;max-width:51%}.wait-title h1{font-size:clamp(38px,4.25vw,86px);line-height:1.04;margin:0 0 24px;font-weight:650}.wait-title p{color:var(--white);font-size:clamp(17px,1.35vw,26px)}.ring{position:absolute;top:30%;right:8%;width:26vw;height:26vw;min-width:270px;min-height:270px;max-width:530px;max-height:530px;display:grid;place-items:center}.ring svg{position:absolute;width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 0 14px #d8b77933)}.ring circle{fill:none;stroke:#7589a433;stroke-width:5}.ring .progress{stroke:var(--gold);stroke-width:5;stroke-linecap:round;stroke-dasharray:301.59;stroke-dashoffset:0;transition:stroke-dashoffset .5s linear}.ring .dot{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff1d6;box-shadow:0 0 16px 6px #d8b77977}.time{text-align:center;z-index:1}.time span{display:block;color:var(--gold);letter-spacing:.18em;font-size:clamp(12px,.9vw,20px)}.time strong{display:block;font-size:clamp(46px,5vw,96px);font-weight:550;font-variant-numeric:tabular-nums}.bottom{position:absolute;bottom:9%;left:6%;right:6%}.message{font-size:clamp(18px,1.5vw,32px);margin-bottom:20px;min-height:40px;transition:opacity .5s}.bar{height:6px;background:#FFFFFF24;border-radius:10px;overflow:hidden}.bar i{display:block;width:100%;height:100%;background:linear-gradient(90deg,var(--primary),var(--gold));transition:width .5s linear}.lower{position:absolute;bottom:8%;left:3.4%;max-width:72%;min-width:40%;display:flex;align-items:stretch;filter:drop-shadow(0 8px 20px #0008);animation:up .5s both}.lower .accent{background:var(--primary);width:8px}.lower .content{padding:18px 45px 19px 27px;background:var(--panel);border-bottom:2px solid var(--accent,var(--gold))}.eyebrow{display:block;color:var(--gold);font-size:clamp(11px,1.05vw,19px);text-transform:uppercase;letter-spacing:.11em;margin-bottom:5px}.maintext{font-size:clamp(26px,2.4vw,47px);font-weight:600;overflow-wrap:anywhere}.subtext{font-size:clamp(17px,1.3vw,27px);color:var(--white);margin-top:5px}.full{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:8%;background:radial-gradient(ellipse at center,var(--panel),var(--navy))}.full h1{font-size:clamp(45px,5vw,100px);margin:20px 0}.full p{font-size:clamp(20px,1.8vw,38px);color:var(--white)}.full img{max-height:190px;max-width:320px;object-fit:contain}.full .small{letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}.ticker{position:absolute;bottom:0;left:0;right:0;background:var(--panel);border-top:2px solid var(--primary);padding:12px 25px;font-size:clamp(15px,1.15vw,23px);text-align:center;animation:up .5s both}@keyframes up{from{transform:translateY(25px);opacity:0}to{transform:translateY(0);opacity:1}}.hidden{display:none!important}
.cover-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.66}.cover-shade{position:absolute;inset:0;background:linear-gradient(90deg,var(--navy) 0%,color-mix(in srgb,var(--navy) 85%,transparent) 48%,color-mix(in srgb,var(--navy) 68%,transparent) 100%)}.slide-card{position:absolute;left:5.9%;top:49%;width:46%;min-height:215px;border-radius:16px;background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid #ffffff33;display:flex;overflow:hidden;box-shadow:0 20px 50px #0006;animation:fadein .6s ease}.slide-card img{width:39%;object-fit:cover;flex-shrink:0}.slide-copy{padding:24px 27px;display:flex;flex-direction:column;justify-content:center;gap:10px;min-width:0}.slide-copy small{color:var(--gold);letter-spacing:.16em;text-transform:uppercase;font-size:15px}.slide-copy h2{margin:0;font-size:clamp(24px,2vw,42px);line-height:1.13;overflow-wrap:anywhere}.slide-copy p{margin:0;font-size:clamp(16px,1.05vw,23px);line-height:1.34;white-space:pre-wrap;overflow-wrap:anywhere}.slide-card.textonly{width:46%}.slide-card.textonly .slide-copy{padding:28px 34px}@keyframes fadein{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}#wait:has(.slide-card:not(.hidden)) .wait-title{top:27%}#wait:has(.slide-card:not(.hidden)) .wait-title h1{font-size:clamp(32px,3.2vw,66px);margin-bottom:10px}#wait:has(.slide-card:not(.hidden)) .message{font-size:21px}
.social-strip{position:absolute;z-index:15;left:5.9%;bottom:12.2%;max-width:52%;display:flex;align-items:center;gap:15px;padding:12px 18px;border-radius:13px;background:color-mix(in srgb,var(--panel) 92%,transparent);box-shadow:0 10px 36px #0004;border:1px solid #ffffff22}.social-items{display:flex;flex-wrap:wrap;gap:8px 16px}.social-item{display:flex;align-items:center;gap:7px;font-size:19px;max-width:350px;overflow-wrap:anywhere}.social-icon{display:inline-flex;justify-content:center;align-items:center;min-width:27px;height:27px;background:var(--primary);color:var(--navy);font-size:13px;font-weight:800;border-radius:8px}.social-qr{width:82px;height:82px;object-fit:contain;background:white;padding:5px;border-radius:6px;flex-shrink:0}.social-strip.closing{left:50%;bottom:8%;transform:translateX(-50%);max-width:85%;width:max-content;justify-content:center}.social-strip.closing .social-item{font-size:22px}#wait:has(.social-strip:not(.hidden)) .bottom{bottom:3%}

.logo-onair{position:absolute;z-index:25;right:3.2%;top:4%;width:clamp(95px,10vw,195px);height:clamp(70px,10vw,180px);display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .7s ease,transform .7s ease;transform:translateY(-14px)}.logo-onair.show{opacity:1;transform:translateY(0)}.logo-onair img,.logo-onair video{width:100%;height:100%;object-fit:contain}.social-float{position:absolute;z-index:27;left:4%;bottom:5%;max-width:70%;background:color-mix(in srgb,var(--panel) 93%,transparent);border-left:5px solid var(--primary);padding:13px 22px;border-radius:8px;display:flex;align-items:center;gap:15px;pointer-events:none;opacity:0;transform:translateY(40px);transition:opacity .65s ease,transform .65s ease;box-shadow:0 12px 35px #0006}.social-float.show{opacity:1;transform:translateY(0)}.social-float .social-items{display:flex;gap:14px;flex-wrap:wrap}.social-float .social-item{font-size:19px}.social-float img.social-qr{width:65px;height:65px}.social-float.hidden-force{display:none}
</style></head><body><div class="canvas">
<section id="wait" class="hidden"><div class="bg"></div><img class="cover-photo hidden" id="coverPhoto" alt=""><div class="cover-shade hidden" id="coverShade"></div><div class="gridlight"></div><div id="particles"></div><header class="brand"><img id="waitLogo" class="hidden"><div class="mark"></div><div><span>Transmisión en directo · Celebración eucarística</span><strong><span id="brandName">Mi parroquia</span></strong></div></header><div class="wait-title"><h1 id="waitTitle">Santa Misa</h1><p id="waitSubtitle">En breve comenzaremos nuestra celebración</p></div><div id="slideCard" class="slide-card hidden"><img id="slideImg" class="hidden" alt=""><div class="slide-copy"><small>Información parroquial</small><h2 id="slideTitle"></h2><p id="slideBody"></p></div></div><div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="48"></circle><circle id="progress" class="progress" cx="60" cy="60" r="48"></circle></svg><div id="dot" class="dot"></div><div class="time"><span>COMENZAMOS EN</span><strong id="clock">15:00</strong></div></div><footer class="bottom"><div id="msg" class="message">Gracias por acompañarnos</div><div class="bar"><i id="bar"></i></div></footer></section>
<div id="persistentLogo" class="logo-onair"><img id="persistentLogoImg" alt="Logo parroquial"><video id="persistentLogoVideo" muted autoplay loop playsinline preload="auto" style="display:none"></video></div><div id="socialDuring" class="social-float"><div class="social-items"></div><img class="social-qr hidden" alt="Código QR de la parroquia"></div><div id="socialWait" class="social-strip hidden"><div class="social-items"></div><img class="social-qr hidden" alt="Código QR de las redes parroquiales"></div><section id="lower" class="lower hidden"><div class="accent"></div><div class="content"><span id="eyebrow" class="eyebrow"></span><div id="maintext" class="maintext"></div><div id="subtext" class="subtext"></div></div></section>
<section id="full" class="full hidden"><div><img id="fullLogo" class="hidden"><div id="fullLabel" class="small"></div><h1 id="fullTitle"></h1><p id="fullSub"></p><p id="fullDetail"></p></div></section><div id="socialClose" class="social-strip closing hidden"><div class="social-items"></div><img class="social-qr hidden" alt="Código QR de las redes parroquiales"></div><div id="ticker" class="ticker hidden"></div></div>
<script>
const el=id=>document.getElementById(id);const particles=el('particles');for(let i=0;i<48;i++){const d=document.createElement('i');d.className='particle';d.style.setProperty('--left',Math.random()*100+'%');d.style.setProperty('--dur',12+Math.random()*23+'s');d.style.setProperty('--move',(-180+Math.random()*360)+'px');d.style.animationDelay=(-Math.random()*35)+'s';particles.appendChild(d)}
let oldMode='',messages=[],lastMsg=-1,lastSlide=-1;let lastSocial='';
function showSocial(s,mode){const accounts=s.social_accounts||{};const data=Object.entries({instagram:'IG',facebook:'f',youtube:'YT',whatsapp:'WA'}).filter(([key])=>!!(accounts[key]||'').trim());const valid=data.length>0||!!s.social_qr;const key=JSON.stringify([data,accounts,s.social_qr]);const nodes=[el('socialWait'),el('socialClose'),el('socialDuring')];if(key!==lastSocial){nodes.forEach(box=>{const items=box.querySelector('.social-items');items.replaceChildren();data.forEach(([platform,short])=>{const entry=document.createElement('div');entry.className='social-item';const ico=document.createElement('span');ico.className='social-icon';ico.textContent=short;const label=document.createElement('span');label.textContent=accounts[platform];entry.append(ico,label);items.append(entry)});const qr=box.querySelector('img');qr.classList.toggle('hidden',!s.social_qr);if(s.social_qr)qr.src=s.social_qr});lastSocial=key}nodes[0].classList.toggle('hidden',mode!=='espera'||!s.social_enabled||!valid);nodes[1].classList.toggle('hidden',mode!=='cierre'||!s.social_closing||!valid);
const allowed=['cintillo','participante'];const show=(allowed.includes(mode)&&s.social_during_mass&&valid&&s.visible&&((s.social_now===true)||((Math.floor(Date.now()/1000)%(Math.max(30,Number(s.social_every)||150)))<Math.min(30,Math.max(3,Number(s.social_duration)||9)))&&s.social_now!==false));
el('socialDuring').classList.toggle('show',!!show);el('socialDuring').classList.toggle('hidden-force',!allowed.includes(mode)||!s.social_during_mass||!valid);
}

function render(s){el('brandName').textContent=s.parish_name||'Mi parroquia';const c=s.colors||{};const root=document.documentElement;for(const [v,k] of [['--primary','primary'],['--navy','background'],['--gold','accent'],['--white','text'],['--panel','panel']])if(/^#[0-9a-fA-F]{6}$/.test(c[k]||''))root.style.setProperty(v,c[k]);let mode=s.visible?s.mode:'limpio';showSocial(s,mode);el('wait').classList.toggle('hidden',mode!=='espera');const low=['cintillo','lectura','salmo','evangelio','homilia','ofertorio','comunion','participante'].includes(mode);el('lower').classList.toggle('hidden',!low);let full=['avisos','cierre','incidencia'].includes(mode);el('full').classList.toggle('hidden',!full);el('ticker').classList.toggle('hidden',!s.ticker_visible || !s.ticker || mode==='espera'||full||mode==='limpio'||mode==='ofertorio'||mode==='comunion');el('ticker').textContent=s.ticker||'';
if(mode==='espera'){
let cover=!!(s.cover_mode==='image'&&s.cover_image);el('coverPhoto').classList.toggle('hidden',!cover);el('coverShade').classList.toggle('hidden',!cover);if(cover&&el('coverPhoto').getAttribute('src')!==s.cover_image)el('coverPhoto').src=s.cover_image;
const slides=s.slides_enabled!==false&&Array.isArray(s.slides)?s.slides.filter(x=>x.title||x.body):[];const idx=slides.length?Math.floor(Date.now()/(Math.max(4,Number(s.slide_interval)||12)*1000))%slides.length:-1;
let card=el('slideCard');card.classList.toggle('hidden',idx<0);if(idx>=0){const item=slides[idx];const identity=JSON.stringify(item);if(card.dataset.identity!==identity){card.dataset.identity=identity;card.style.animation='none';void card.offsetWidth;card.style.animation='fadein .6s ease';el('slideTitle').textContent=item.title||'';el('slideBody').textContent=item.body||'';el('slideImg').classList.toggle('hidden',!item.photo);card.classList.toggle('textonly',!item.photo);if(item.photo)el('slideImg').src=item.photo}}
 el('waitTitle').textContent=s.title||'Santa Misa';el('waitSubtitle').textContent=s.detail||'En breve comenzaremos';let sec=Math.max(0,s.remaining);el('clock').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');let pct=Math.min(1,sec/Math.max(1,60*s.timer_minutes));el('progress').style.strokeDashoffset=301.59*(1-pct);el('bar').style.width=pct*100+'%';let theta=(-90+360*pct)*Math.PI/180;let ring=el('dot').parentElement;let radius=ring.clientWidth*.4;let cx=ring.clientWidth/2;el('dot').style.left=(cx+radius*Math.cos(theta)-6)+'px';el('dot').style.top=(cx+radius*Math.sin(theta)-6)+'px';let arr=s.announcements?.length?s.announcements:['Gracias por acompañarnos'];let n=Math.floor(Date.now()/18000)%arr.length;if(n!==lastMsg||oldMode!==mode){el('msg').textContent=arr[n];lastMsg=n}}
if(low){let labels={cintillo:'CELEBRACIÓN EUCARÍSTICA',lectura:'LITURGIA DE LA PALABRA',salmo:'SALMO RESPONSORIAL',evangelio:'SANTO EVANGELIO',homilia:'HOMILÍA',ofertorio:'PRESENTACIÓN DE LAS OFRENDAS',comunion:'SAGRADA COMUNIÓN',participante:'SERVIDORES DE LA CELEBRACIÓN'};el('eyebrow').textContent=labels[mode];
if(mode==='participante'){
 const role=s.role||'celebrante';const names=s.participants||{};
 const label={celebrante:'CELEBRANTE',diacono:'DIÁCONO',salmista:'SALMISTA',lectores:'LECTOR / PROCLAMADOR',monitores:'MONITOR'};
 const arr=Array.isArray(names[role])?names[role]:[names[role]||''];
 const index=Math.min(arr.length-1,Math.max(0,s.role_index||0));
 el('eyebrow').textContent=label[role]||'PARTICIPANTE';
 el('maintext').textContent=arr[index]||'';
 el('subtext').textContent=s.parish_name||'Mi parroquia';
 el('lower').classList.toggle('hidden',!arr[index]);
}else{
 el('maintext').textContent=s.title||'';
 el('subtext').textContent=mode==='salmo' && s.salmo_respuesta ? ('Respuesta: '+s.salmo_respuesta) : (s.reference||s.detail||'');
}}
if(full){el('fullLabel').textContent=mode==='avisos'?'INFORMACIÓN PARROQUIAL':mode==='incidencia'?'AVISO DE TRANSMISIÓN':'GRACIAS POR ACOMPAÑARNOS';el('fullTitle').textContent=s.title||'';el('fullSub').textContent=s.subtitle||'';el('fullDetail').textContent=s.detail||''}
const persistent=el('persistentLogo');const video=el('persistentLogoVideo');const img=el('persistentLogoImg');
const logoVisible=s.logo_persistent!==false&&mode!=='espera'&&mode!=='cierre'&&mode!=='incidencia'&&!!(s.logo_video||s.logo);
persistent.classList.toggle('show',logoVisible);
if(s.logo_video){if(video.getAttribute('src')!==s.logo_video){video.src=s.logo_video;video.load();video.play().catch(()=>{});}video.style.display='block';img.style.display='none';}
else{video.style.display='none';if(!video.paused)video.pause();img.style.display='block';if(s.logo&&img.getAttribute('src')!==s.logo)img.src=s.logo;}
for(let [id,show] of [['waitLogo',mode==='espera'],['fullLogo',full]]){let img=el(id);img.classList.toggle('hidden',!show||!s.logo);if(s.logo&&img.getAttribute('src')!==s.logo)img.setAttribute('src',s.logo)}oldMode=mode}
async function tick(){try{let r=await fetch('/api/state',{cache:'no-store'});render(await r.json())}catch(e){}}setInterval(tick,500);tick();
</script></body></html>
