<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Producción litúrgica · Salida OBS</title><style>
:root{--gold:#D6B678;--navy:#0A1C29;--white:#F4F7F9;--primary:#2E986E;--panel:#102C35}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif;color:var(--white)}.canvas{position:relative;width:100vw;height:100vh;overflow:hidden}.bg{position:absolute;inset:0;background:radial-gradient(ellipse at 80% 15%,var(--panel) 0%,var(--navy) 75%)}.gridlight{position:absolute;inset:-20%;opacity:.4;background:radial-gradient(circle at 25% 30%,color-mix(in srgb,var(--gold) 13%,transparent),transparent 30%),radial-gradient(circle at 85% 80%,color-mix(in srgb,var(--primary) 15%,transparent),transparent 22%);animation:float 15s ease-in-out infinite alternate}.particle{position:absolute;width:3px;height:3px;background:var(--gold);border-radius:50%;opacity:.45;animation:drift var(--dur) linear infinite;left:var(--left);top:110%}@keyframes drift{to{transform:translate(var(--move),-140vh);opacity:0}}@keyframes float{to{transform:translate(3%,4%)}}.gold{color:var(--gold)}.brand{position:absolute;top:6%;left:5.8%;right:5.8%;display:flex;align-items:center;gap:24px}.brand img{width:118px;height:118px;object-fit:contain}.brand strong{font-size:clamp(24px,2vw,40px);letter-spacing:.02em;line-height:1.12}.brand span{display:block;text-transform:uppercase;letter-spacing:.17em;font-size:clamp(11px,1vw,18px);color:var(--gold);margin-bottom:8px}.brand .mark{width:8px;height:80px;background:var(--gold);border-radius:7px}.wait-title{position:absolute;top:29%;left:6%;max-width:51%}.wait-title h1{font-size:clamp(38px,4.25vw,86px);line-height:1.04;margin:0 0 24px;font-weight:650}.wait-title p{color:var(--white);font-size:clamp(17px,1.35vw,26px)}.ring{position:absolute;top:30%;right:8%;width:26vw;height:26vw;min-width:270px;min-height:270px;max-width:530px;max-height:530px;display:grid;place-items:center}.ring svg{position:absolute;width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 0 14px #d8b77933)}.ring circle{fill:none;stroke:#7589a433;stroke-width:5}.ring .progress{stroke:var(--gold);stroke-width:5;stroke-linecap:round;stroke-dasharray:301.59;stroke-dashoffset:0;transition:stroke-dashoffset .5s linear}.ring .dot{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff1d6;box-shadow:0 0 16px 6px #d8b77977}.time{text-align:center;z-index:1}.time span{display:block;color:var(--gold);letter-spacing:.18em;font-size:clamp(12px,.9vw,20px)}.time strong{display:block;font-size:clamp(46px,5vw,96px);font-weight:550;font-variant-numeric:tabular-nums}.bottom{position:absolute;bottom:9%;left:6%;right:6%}.message{font-size:clamp(18px,1.5vw,32px);margin-bottom:20px;min-height:40px;transition:opacity .5s}.bar{height:6px;background:#FFFFFF24;border-radius:10px;overflow:hidden}.bar i{display:block;width:100%;height:100%;background:linear-gradient(90deg,var(--primary),var(--gold));transition:width .5s linear}.lower{position:absolute;bottom:8%;left:3.4%;max-width:72%;min-width:40%;display:flex;align-items:stretch;filter:drop-shadow(0 8px 20px #0008);animation:up .5s both}.lower .accent{background:var(--primary);width:8px}.lower .content{padding:18px 45px 19px 27px;background:var(--panel);border-bottom:2px solid var(--accent,var(--gold))}.eyebrow{display:block;color:var(--gold);font-size:clamp(11px,1.05vw,19px);text-transform:uppercase;letter-spacing:.11em;margin-bottom:5px}.maintext{font-size:clamp(26px,2.4vw,47px);font-weight:600;overflow-wrap:anywhere}.subtext{font-size:clamp(17px,1.3vw,27px);color:var(--white);margin-top:5px}.full{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:8%;background:radial-gradient(ellipse at center,var(--panel),var(--navy))}.full h1{font-size:clamp(45px,5vw,100px);margin:20px 0}.full p{font-size:clamp(20px,1.8vw,38px);color:var(--white)}.full img{max-height:190px;max-width:320px;object-fit:contain}.full .small{letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}.ticker{position:absolute;bottom:0;left:0;right:0;background:var(--panel);border-top:2px solid var(--primary);padding:12px 25px;font-size:clamp(15px,1.15vw,23px);text-align:center;animation:up .5s both}@keyframes up{from{transform:translateY(25px);opacity:0}to{transform:translateY(0);opacity:1}}.hidden{display:none!important}
.cover-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.66}.cover-shade{position:absolute;inset:0;background:linear-gradient(90deg,var(--navy) 0%,color-mix(in srgb,var(--navy) 85%,transparent) 48%,color-mix(in srgb,var(--navy) 68%,transparent) 100%)}.slide-card{position:absolute;left:5.9%;top:49%;width:46%;min-height:215px;border-radius:16px;background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid #ffffff33;display:flex;overflow:hidden;box-shadow:0 20px 50px #0006;animation:fadein .6s ease}.slide-card img{width:39%;object-fit:cover;flex-shrink:0}.slide-copy{padding:24px 27px;display:flex;flex-direction:column;justify-content:center;gap:10px;min-width:0}.slide-copy small{color:var(--gold);letter-spacing:.16em;text-transform:uppercase;font-size:15px}.slide-copy h2{margin:0;font-size:clamp(24px,2vw,42px);line-height:1.13;overflow-wrap:anywhere}.slide-copy p{margin:0;font-size:clamp(16px,1.05vw,23px);line-height:1.34;white-space:pre-wrap;overflow-wrap:anywhere}.slide-card.textonly{width:46%}.slide-card.textonly .slide-copy{padding:28px 34px}@keyframes fadein{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}#wait:has(.slide-card:not(.hidden)) .wait-title{top:27%}#wait:has(.slide-card:not(.hidden)) .wait-title h1{font-size:clamp(32px,3.2vw,66px);margin-bottom:10px}#wait:has(.slide-card:not(.hidden)) .message{font-size:21px}
.social-strip{position:absolute;z-index:15;left:5.9%;bottom:12.2%;max-width:52%;display:flex;align-items:center;gap:15px;padding:12px 18px;border-radius:13px;background:color-mix(in srgb,var(--panel) 92%,transparent);box-shadow:0 10px 36px #0004;border:1px solid #ffffff22}.social-items{display:flex;flex-wrap:wrap;gap:8px 16px}.social-item{display:flex;align-items:center;gap:7px;font-size:19px;max-width:350px;overflow-wrap:anywhere}.social-icon{display:inline-flex;justify-content:center;align-items:center;min-width:27px;height:27px;background:var(--primary);color:var(--navy);font-size:13px;font-weight:800;border-radius:8px}.social-qr{width:82px;height:82px;object-fit:contain;background:white;padding:5px;border-radius:6px;flex-shrink:0}.social-strip.closing{left:50%;bottom:8%;transform:translateX(-50%);max-width:85%;width:max-content;justify-content:center}.social-strip.closing .social-item{font-size:22px}#wait:has(.social-strip:not(.hidden)) .bottom{bottom:3%}

.logo-onair{position:absolute;z-index:25;right:3.2%;top:4%;width:clamp(95px,10vw,195px);height:clamp(70px,10vw,180px);display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .7s ease,transform .7s ease;transform:translateY(-14px)}.logo-onair.show{opacity:1;transform:translateY(0)}.logo-onair img,.logo-onair video{width:100%;height:100%;object-fit:contain}.social-float{position:absolute;z-index:27;left:4%;bottom:5%;max-width:70%;background:color-mix(in srgb,var(--panel) 93%,transparent);border-left:5px solid var(--primary);padding:13px 22px;border-radius:8px;display:flex;align-items:center;gap:15px;pointer-events:none;opacity:0;transform:translateY(40px);transition:opacity .65s ease,transform .65s ease;box-shadow:0 12px 35px #0006}.social-float.show{opacity:1;transform:translateY(0)}.social-float .social-items{display:flex;gap:14px;flex-wrap:wrap}.social-float .social-item{font-size:19px}.social-float img.social-qr{width:65px;height:65px}.social-float.hidden-force{display:none}
.social-icon{min-width:44px;height:44px;border-radius:12px;flex:none;color:#fff}
.social-icon svg,.social-icon img{width:28px;height:28px;object-fit:contain}
.social-icon img{width:100%;height:100%;border-radius:9px}
.social-copy{display:flex;flex-direction:column;gap:3px;overflow-wrap:anywhere}
.social-copy strong{color:var(--gold);font-size:clamp(14px,1.05vw,21px)}
.social-copy>span{font-size:clamp(15px,1.2vw,24px);font-weight:650}
.social-float.has-lower{left:auto;right:4%;max-width:40%}
.social-float .social-items{flex-wrap:nowrap}
.social-strip .social-items{flex-wrap:nowrap}
.social-strip.closing .social-item{min-width:250px}

.styled-lower{position:absolute;z-index:12;bottom:8%;left:4%;width:max-content;min-width:34%;max-width:80%;color:#fff;--lt-bg:#152941;--lt-accent:#D6B678;--lt-opacity:.94;--lt-duration:650ms;opacity:0;pointer-events:none;transform-origin:0 100%;overflow-wrap:anywhere}
.styled-lower .style-panel{padding:22px 30px;background:color-mix(in srgb,var(--lt-bg) calc(var(--lt-opacity) * 100%),transparent);border-left:9px solid var(--lt-accent);border-radius:3px 15px 15px 3px;box-shadow:0 12px 28px #0008}
.styled-lower .style-role{color:var(--lt-accent);font-size:clamp(16px,1.1vw,23px);font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.styled-lower .style-name{font-size:clamp(30px,2.7vw,55px);font-weight:800;line-height:1.12;margin-top:8px}
.styled-lower .style-subtitle{font-size:clamp(18px,1.35vw,28px);margin-top:8px}
.styled-lower.minimal .style-panel{background:transparent;border:0;border-bottom:4px solid var(--lt-accent);border-radius:0;padding:8px 0;text-shadow:0 2px 8px #000;box-shadow:none}
.styled-lower.liturgical .style-panel{border:2px solid var(--lt-accent);border-left-width:12px;background:color-mix(in srgb,var(--lt-bg) 93%,transparent)}
.styled-lower.modern .style-panel{border-left:0;border-radius:28px 6px 28px 6px;box-shadow:12px 12px 0 -5px var(--lt-accent)}
.styled-lower.enter.fade{animation:ltFadeIn var(--lt-duration) ease-out both}.styled-lower.leaving.fade{animation:ltFadeOut var(--lt-duration) ease-in both}
.styled-lower.enter.left{animation:ltLeftIn var(--lt-duration) ease-out both}.styled-lower.leaving.left{animation:ltLeftOut var(--lt-duration) ease-in both}
.styled-lower.enter.right{animation:ltRightIn var(--lt-duration) ease-out both}.styled-lower.leaving.right{animation:ltRightOut var(--lt-duration) ease-in both}
.styled-lower.enter.rise{animation:ltRiseIn var(--lt-duration) ease-out both}.styled-lower.leaving.rise{animation:ltRiseOut var(--lt-duration) ease-in both}
.styled-lower.enter.zoom{animation:ltZoomIn var(--lt-duration) ease-out both}.styled-lower.leaving.zoom{animation:ltZoomOut var(--lt-duration) ease-in both}
.styled-lower.enter.none{opacity:1}.styled-lower.leaving.none{opacity:0}
@keyframes ltFadeIn{from{opacity:0}to{opacity:1}}@keyframes ltFadeOut{from{opacity:1}to{opacity:0}}
@keyframes ltLeftIn{from{opacity:0;transform:translateX(-90px)}to{opacity:1;transform:none}}@keyframes ltLeftOut{from{opacity:1;transform:none}to{opacity:0;transform:translateX(-90px)}}
@keyframes ltRightIn{from{opacity:0;transform:translateX(90px)}to{opacity:1;transform:none}}@keyframes ltRightOut{from{opacity:1;transform:none}to{opacity:0;transform:translateX(90px)}}
@keyframes ltRiseIn{from{opacity:0;transform:translateY(45px)}to{opacity:1;transform:none}}@keyframes ltRiseOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(45px)}}
@keyframes ltZoomIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}@keyframes ltZoomOut{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(.88)}}
@media(prefers-reduced-motion:reduce){.styled-lower.enter,.styled-lower.leaving{animation:none!important}.styled-lower.enter{opacity:1}.styled-lower.leaving{opacity:0}}
</style></head><body><div class="canvas">
<section id="wait" class="hidden"><div class="bg"></div><img class="cover-photo hidden" id="coverPhoto" alt=""><div class="cover-shade hidden" id="coverShade"></div><div class="gridlight"></div><div id="particles"></div><header class="brand"><img id="waitLogo" class="hidden"><div class="mark"></div><div><span>Transmisión en directo · Celebración eucarística</span><strong><span id="brandName">Mi parroquia</span></strong></div></header><div class="wait-title"><h1 id="waitTitle">Santa Misa</h1><p id="waitSubtitle">En breve comenzaremos nuestra celebración</p></div><div id="slideCard" class="slide-card hidden"><img id="slideImg" class="hidden" alt=""><div class="slide-copy"><small>Información parroquial</small><h2 id="slideTitle"></h2><p id="slideBody"></p></div></div><div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="48"></circle><circle id="progress" class="progress" cx="60" cy="60" r="48"></circle></svg><div id="dot" class="dot"></div><div class="time"><span>COMENZAMOS EN</span><strong id="clock">15:00</strong></div></div><footer class="bottom"><div id="msg" class="message">Gracias por acompañarnos</div><div class="bar"><i id="bar"></i></div></footer></section>
<div id="persistentLogo" class="logo-onair"><img id="persistentLogoImg" alt="Logo parroquial"><video id="persistentLogoVideo" muted autoplay loop playsinline preload="auto" style="display:none"></video></div><div id="socialDuring" class="social-float"><div class="social-items"></div><img class="social-qr hidden" alt="Código QR de la parroquia"></div><div id="socialWait" class="social-strip hidden"><div class="social-items"></div><img class="social-qr hidden" alt="Código QR de las redes parroquiales"></div><section id="lower" class="lower hidden"><div class="accent"></div><div class="content"><span id="eyebrow" class="eyebrow"></span><div id="maintext" class="maintext"></div><div id="subtext" class="subtext"></div></div></section>
<section id="styledLower" class="styled-lower hidden" aria-label="Lower Third personalizado"><div class="style-panel"><div id="styledRole" class="style-role"></div><div id="styledName" class="style-name"></div><div id="styledSubtitle" class="style-subtitle"></div></div></section>
<section id="full" class="full hidden"><div><img id="fullLogo" class="hidden"><div id="fullLabel" class="small"></div><h1 id="fullTitle"></h1><p id="fullSub"></p><p id="fullDetail"></p></div></section><div id="socialClose" class="social-strip closing hidden"><div class="social-items"></div><img class="social-qr hidden" alt="Código QR de las redes parroquiales"></div><div id="ticker" class="ticker hidden"></div></div>
<script>
const el=id=>document.getElementById(id);const particles=el('particles');for(let i=0;i<48;i++){const d=document.createElement('i');d.className='particle';d.style.setProperty('--left',Math.random()*100+'%');d.style.setProperty('--dur',12+Math.random()*23+'s');d.style.setProperty('--move',(-180+Math.random()*360)+'px');d.style.animationDelay=(-Math.random()*35)+'s';particles.appendChild(d)}
let oldMode='',messages=[],lastMsg=-1,lastSlide=-1;
// Una red por turno: la lista emitida queda fijada al iniciar la rotación.
const socialMarks={
 instagram:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="17.5" cy="6.6" r="1.3" fill="currentColor"/></svg>',
 facebook:'<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M14.1 22v-8.8H17l.5-3.6h-3.4V7.3c0-1.1.4-1.8 1.9-1.8h1.7V2.3C17 2.1 16 2 15 2c-3.2 0-5.2 2-5.2 5.4v2.2H7v3.6h2.8V22z"/></svg>',
 youtube:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="1.5" y="5" width="21" height="14" rx="4" fill="currentColor"/><path d="m10 8.5 6 3.5-6 3.5z" fill="#fff"/></svg>',
 whatsapp:'<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.3" d="M20.4 11.5a8.3 8.3 0 0 1-12.2 7.3L3 20l1.4-4.8a8.3 8.3 0 1 1 16-3.7z"/><path fill="currentColor" d="M8.4 7.5c-.8.3-1.2 1.3-.7 2.5 1 2.6 3.8 5.2 6.5 6.1 1.2.4 2.4-.1 2.8-.9l-2.4-1.5-1.1 1c-1.5-.7-2.8-1.8-3.6-3.3l.8-1.1z"/></svg>',
 telegram:'<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21.8 3.4 2.9 10.7c-1.2.5-1.2 1.3 0 1.7l4.8 1.5 1.9 6c.2.5.3.7.7.7s.6-.2.9-.5l2.7-2.7 5 3.7c.9.5 1.5.3 1.8-.9L23 5c.3-1.3-.5-1.9-1.2-1.6zM9 13.6 19 7.3l-8.1 7.5-.3 3.1z"/></svg>',
 tiktok:'<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M14 2h3c.2 2.9 1.7 4.6 4.2 4.8v3.4c-1.8 0-3.3-.6-4.6-1.6v6.7A6.8 6.8 0 1 1 9.7 8.6v3.6a3.3 3.3 0 1 0 3.8 3.3V2z"/></svg>',
 website:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h18M12 3c-5 5-5 13 0 18M12 3c5 5 5 13 0 18" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>'
};
const socialColors={instagram:'#b73c8d',facebook:'#1877f2',youtube:'#f20d16',whatsapp:'#169e61',telegram:'#259bd5',tiktok:'#20222b',website:'#285d87'};
const socialPhrases={instagram:'Síguenos',facebook:'Dale like y comparte',youtube:'Suscríbete',whatsapp:'Escríbenos',telegram:'Únete al canal',tiktok:'Síguenos',website:'Visítanos'};
let lastSocial='';
function showSocial(s,mode){
 const rotation=s.social_rotation;
 const usingPlaylist=!!(rotation&&Array.isArray(rotation.items)&&rotation.items.length);
 const legacyAccounts=s.social_accounts||{};
 const entries=usingPlaylist?rotation.items.filter(x=>x&&x.handle):
  Object.keys(socialPhrases).filter(k=>legacyAccounts[k]).map(network=>({network,handle:legacyAccounts[network],phrase:socialPhrases[network],logo:''}));
 if(!usingPlaylist&&s.social_qr)entries.push({network:'qr',handle:'Escanea y conecta',phrase:'Comparte la transmisión',logo:s.social_qr});
 const settings=usingPlaylist?rotation.settings||{}:{duration:s.social_duration||9,interval:s.social_every||150,loop:true,placement:'all'};
 const duration=Math.max(3,Math.min(30,Number(settings.duration)||7));
 const interval=Math.max(duration,Math.min(900,Number(settings.interval)||12));
 const elapsed=Math.max(0,Date.now()/1000-(usingPlaylist?Number(rotation.started_at)||0:0));
 const turn=Math.floor(elapsed/interval);
 const idx=entries.length?(usingPlaylist?turn%entries.length:Math.floor(Date.now()/1000/interval)%entries.length):-1;
 const slotVisible=usingPlaylist?(settings.loop!==false||turn<entries.length)&&elapsed%interval<duration:
  Math.floor(Date.now()/1000)%interval<duration;
 const inWaiting=mode==='espera',inClosing=mode==='cierre';
 const isPreview=mode==='social_preview';
 const inDirect=!inWaiting&&!inClosing&&mode!=='limpio'&&mode!=='incidencia';
 const placement=settings.placement||'all';
 const placeAllowed=isPreview||placement==='all'||
     (placement==='espera'&&inWaiting)||(placement==='cierre'&&inClosing)||
     (placement==='directo'&&inDirect);
 const oldAllowed=inWaiting?s.social_enabled:inClosing?s.social_closing:s.social_during_mass;
 const allowed=(usingPlaylist||oldAllowed)&&placeAllowed&&idx>=0&&s.visible!==false&&s.social_now!==false&&
     (isPreview||inWaiting||inClosing||inDirect)&&
     (usingPlaylist?slotVisible:(inWaiting||inClosing||s.social_now===true||slotVisible));
 const boxes=[el('socialWait'),el('socialClose'),el('socialDuring')];
 const target=inWaiting?boxes[0]:inClosing?boxes[1]:boxes[2];
 const selected=allowed?entries[idx]:null;
 const key=JSON.stringify([selected,allowed,mode]);
 if(key!==lastSocial){
  boxes.forEach(box=>{
   const items=box.querySelector('.social-items');items.replaceChildren();
   const qr=box.querySelector('img.social-qr');qr.classList.add('hidden');
   if(!selected||box!==target)return;
   const entry=document.createElement('div');entry.className='social-item';
   const icon=document.createElement('span');icon.className='social-icon';icon.style.background=socialColors[selected.network]||'#315d7d';
   if(selected.logo&&/^\/media\/[a-f0-9]{32}\.(png|jpg|webp)$/.test(selected.logo)){
    const img=document.createElement('img');img.alt='';img.src=selected.logo;icon.append(img);
   }else if(selected.network==='qr'&&s.social_qr){const img=document.createElement('img');img.alt='';img.src=s.social_qr;icon.append(img)}
   else icon.innerHTML=socialMarks[selected.network]||socialMarks.website;
   const copy=document.createElement('span');copy.className='social-copy';
   const phrase=document.createElement('strong');phrase.textContent=selected.phrase||socialPhrases[selected.network]||'Conéctate';
   const handle=document.createElement('span');handle.textContent=selected.handle||'';
   copy.append(phrase,handle);entry.append(icon,copy);items.append(entry);
  });lastSocial=key;
 }
 boxes[0].classList.toggle('hidden',!allowed||target!==boxes[0]);
 boxes[1].classList.toggle('hidden',!allowed||target!==boxes[1]);
 boxes[2].classList.toggle('show',allowed&&target===boxes[2]);
 boxes[2].classList.toggle('hidden-force',!allowed||target!==boxes[2]);
 boxes[2].classList.toggle('has-lower',mode==='lower_third');
}

let styledActive=false,styledTimer=null;
function syncStyledLower(s,mode){
 const node=el('styledLower'),active=mode==='lower_third'&&s.visible!==false;
 if(!active){
  if(mode==='limpio'){styledActive=false;clearTimeout(styledTimer);node.className='styled-lower hidden';return;}
  if(!styledActive)return;
  styledActive=false;clearTimeout(styledTimer);
  node.className='styled-lower '+(node.dataset.template||'classic')+' leaving '+(node.dataset.exit||'fade');
  styledTimer=setTimeout(()=>{if(!styledActive)node.classList.add('hidden')},Number(node.dataset.duration)||650);
  return;
 }
 const cfg=s.lower_third||{},templates=['classic','minimal','liturgical','modern'],effects=['fade','left','right','rise','zoom','none'];
 const template=templates.includes(cfg.template)?cfg.template:'classic',enter=effects.includes(cfg.enter)?cfg.enter:'fade',exit=effects.includes(cfg.exit)?cfg.exit:'fade';
 const duration=Math.max(150,Math.min(2500,Number(cfg.duration)||650));
 node.dataset.template=template;node.dataset.exit=exit;node.dataset.duration=String(duration);
